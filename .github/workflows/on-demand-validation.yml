name: On-demand validation

on:
  # Run this workflow only when requested from Actions. Select the branch and
  # validation scope in the GitHub UI; feature-branch commits do not trigger it.
  workflow_dispatch:
    inputs:
      scope:
        description: Validation scope
        required: true
        type: choice
        default: reconciliation
        options:
          - reconciliation
          - backend
          - frontend
          - full

permissions:
  contents: read

concurrency:
  group: on-demand-validation-${{ github.ref }}-${{ inputs.scope }}
  cancel-in-progress: true

jobs:
  python-validation:
    name: Python validation (${{ inputs.scope }})
    if: ${{ inputs.scope == 'reconciliation' || inputs.scope == 'backend' || inputs.scope == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out selected branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-integrations.txt
            requirements-dev.txt
            requirements-ai.txt
            requirements-ai-pytorch.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run reconciliation regression tests
        if: ${{ inputs.scope == 'reconciliation' }}
        env:
          ENVIRONMENT: testing
        run: |
          python -m pytest -q --durations=10 \
            tests/test_64_reconciliation_escalation_engine.py

      - name: Run backend suite
        if: ${{ inputs.scope == 'backend' || inputs.scope == 'full' }}
        env:
          ENVIRONMENT: testing
          RUN_POSTGRES17_INTEGRATION: ${{ inputs.scope == 'full' && '1' || '0' }}
          POSTGRES17_TEST_URL: postgresql+psycopg://postgres:ci-only-password@127.0.0.1:5432/postgres
        run: python -m pytest -q --durations=10

  frontend-validation:
    name: Frontend production builds
    if: ${{ inputs.scope == 'frontend' || inputs.scope == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out selected branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"
      - name: Build hospital UI
        working-directory: hospital-ui
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Test and build onboarding UI
        working-directory: onboarding-ui
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build

  compose-validation:
    name: Docker Compose configuration
    if: ${{ inputs.scope == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out selected branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate development Compose configuration
        run: |
          cp .env.example .env
          docker compose --env-file .env -f docker-compose.yml config --quiet
      - name: Validate production Compose configuration
        run: |
          cp .env.production.example .env.production
          docker compose --env-file .env.production -f docker-compose.prod.yml config --quiet

  aud004-postgres-proof:
    name: AUD-004 disposable PostgreSQL workload-isolation proof
    if: ${{ inputs.scope == 'reconciliation' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out selected branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Refuse pre-existing proof resources
        id: preflight
        run: |
          if docker volume inspect aud004-proof-pgdata >/dev/null 2>&1; then
            echo "::error::Refusing to reuse existing aud004-proof-pgdata volume"
            exit 1
          fi
          if docker network inspect aud004-proof-only >/dev/null 2>&1; then
            echo "::error::Refusing to reuse existing aud004-proof-only network"
            exit 1
          fi
          # Inspect Compose labels directly: the Compose file has required secret
          # variable interpolation, but secrets are intentionally created only
          # after this preflight succeeds.
          existing_containers="$(docker ps -a --filter label=com.docker.compose.project=aud004-proof --format '{{.ID}}')"
          if [ -n "$existing_containers" ]; then
            echo "::error::Refusing to reuse an existing aud004-proof Compose project"
            exit 1
          fi
          echo "safe_to_cleanup=true" >> "$GITHUB_OUTPUT"
      - name: Generate disposable credentials and per-workload secret files
        id: secrets
        run: |
          python - <<'PY'
          import os
          import secrets
          import tempfile
          from pathlib import Path

          directory = Path(tempfile.mkdtemp(prefix="aud004-secrets-"))
          os.chmod(directory, 0o700)
          # Publish the path immediately so the always-run cleanup can remove
          # this directory even if later secret generation fails.
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"AUD004_SECRETS_DIR={directory}\n")
          values = {
              "AUD004_SETUP_PASSWORD": secrets.token_urlsafe(32),
              "AUD004_TENANT_A_PASSWORD": secrets.token_urlsafe(32),
              "AUD004_TENANT_B_PASSWORD": secrets.token_urlsafe(32),
              "AUD004_CP_PASSWORD": secrets.token_urlsafe(32),
          }
          files = {
              "tenant_a_db_user": "tenant_a_api_test",
              "tenant_a_db_password": values["AUD004_TENANT_A_PASSWORD"],
              "tenant_b_db_user": "tenant_b_api_test",
              "tenant_b_db_password": values["AUD004_TENANT_B_PASSWORD"],
              "control_plane_db_user": "control_plane_test",
              "control_plane_db_password": values["AUD004_CP_PASSWORD"],
          }
          for name, value in files.items():
              path = directory / name
              path.write_text(value, encoding="utf-8")
              os.chmod(path, 0o600)
          # Keep passwords in a mode-0600 Compose interpolation file instead
          # of GITHUB_ENV: Actions prints step environment variables in logs.
          env_path = directory / "compose.env"
          env_path.write_text(
              "".join(f"{name}={value}\n" for name, value in values.items()),
              encoding="utf-8",
          )
          os.chmod(env_path, 0o600)
          PY
      - name: Start isolated PostgreSQL 17 fixture
        run: docker compose --env-file "$AUD004_SECRETS_DIR/compose.env" -p aud004-proof -f deployments/aud004-proof/compose.yaml up -d --wait postgres
      - name: Run tenant A identity proof in its own container
        run: docker compose --env-file "$AUD004_SECRETS_DIR/compose.env" -p aud004-proof -f deployments/aud004-proof/compose.yaml run --build --rm --no-deps tenant_a_probe
      - name: Run tenant B identity proof in its own container
        run: docker compose --env-file "$AUD004_SECRETS_DIR/compose.env" -p aud004-proof -f deployments/aud004-proof/compose.yaml run --build --rm --no-deps tenant_b_probe
      - name: Run control-plane identity proof in its own container
        run: docker compose --env-file "$AUD004_SECRETS_DIR/compose.env" -p aud004-proof -f deployments/aud004-proof/compose.yaml run --build --rm --no-deps control_plane_probe
      - name: Tear down only the disposable proof project and secrets
        if: always() && steps.preflight.outputs.safe_to_cleanup == 'true'
        run: |
          if [ -n "${AUD004_SECRETS_DIR:-}" ] && [ -d "$AUD004_SECRETS_DIR" ]; then
            docker compose --env-file "$AUD004_SECRETS_DIR/compose.env" -p aud004-proof -f deployments/aud004-proof/compose.yaml down --volumes --remove-orphans || true
            rm -rf -- "$AUD004_SECRETS_DIR"
          fi

  aud004-production-role-bootstrap-proof:
    name: AUD-004 production role-bootstrap function proof
    if: ${{ inputs.scope == 'reconciliation' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_USER: aud004_setup
          POSTGRES_PASSWORD: aud004-disposable-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aud004_setup -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out selected branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install isolated PostgreSQL client dependency
        run: python -m pip install --no-cache-dir pytest==9.2.0 psycopg2-binary==2.9.13
      - name: Execute actual production role-bootstrap function
        env:
          AUD004_SETUP_USER: aud004_setup
          AUD004_SETUP_PASSWORD: aud004-disposable-ci-only
          AUD004_PGHOST: 127.0.0.1
          AUD004_PGPORT: "5432"
        run: python -m pytest -q deployments/aud004-proof/test_production_role_bootstrap.py
