name: Release gates

on:
  # Full release validation is deliberately not run on every feature-branch commit.
  # Add the "ci:full" label to a PR when it is ready for the expensive gate.
  pull_request:
    branches: [main, dev, "release/**"]
    types: [labeled]
  # Run automatically after code reaches protected integration/release branches.
  push:
    branches: [main, "release/**"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
  # Manual run: choose the branch from the Actions UI.
  workflow_dispatch:
  # Weekly drift/security check (Monday 07:00 IST).
  schedule:
    - cron: "30 1 * * 1"

permissions:
  contents: read

concurrency:
  group: release-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'ci:full')
    name: Python tests and PostgreSQL 17 migrations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-integrations.txt
            requirements-dev.txt
            requirements-ai.txt
            requirements-ai-pytorch.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt
          python -m pip_audit -r requirements-integrations.txt
          python -m pip_audit -r requirements-ai.txt
          python -m pip_audit -r requirements-ai-pytorch.txt

      - name: Verify test suite collection
        run: python -m pytest --collect-only -q

      - name: Run full test suite and PostgreSQL migration parity test
        env:
          ENVIRONMENT: testing
          RUN_POSTGRES17_INTEGRATION: "1"
          POSTGRES17_TEST_URL: postgresql+psycopg://postgres:ci-only-password@127.0.0.1:5432/postgres
        run: python -m pytest -q --durations=10

  onboarding-ui:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'ci:full')
    name: Build onboarding UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: onboarding-ui/package-lock.json

      - name: Install locked UI dependencies
        working-directory: onboarding-ui
        run: npm ci --no-audit --no-fund

      - name: Audit UI dependencies
        working-directory: onboarding-ui
        run: npm audit --audit-level=moderate

      - name: Test UI pricing utilities
        working-directory: onboarding-ui
        run: npm test

      - name: Build UI
        working-directory: onboarding-ui
        run: npm run build

  hospital-ui:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'ci:full')
    name: Build hospital UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hospital-ui/package-lock.json

      - name: Install locked UI dependencies
        working-directory: hospital-ui
        run: npm ci --no-audit --no-fund

      - name: Build Hospital UI
        working-directory: hospital-ui
        run: npm run build

  compose-config:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'ci:full')
    name: Validate Compose configurations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate development Compose configuration
        run: |
          cp .env.example .env
          docker compose --env-file .env -f docker-compose.yml config --quiet

      - name: Validate production Compose configuration
        run: |
          cp .env.production.example .env.production
          docker compose --env-file .env.production -f docker-compose.prod.yml config --quiet

      - name: Validate Prometheus and Alertmanager configurations
        run: |
          docker run --rm --entrypoint /bin/promtool -v "$(pwd)/deployments:/deployments" prom/prometheus:v2.53.3@sha256:c62e2f333beae2fdac8c3c7a3daaa7ac81110023cbc5857b0ec541f09d997951 check config /deployments/prometheus.yml
          docker run --rm --entrypoint /bin/promtool -v "$(pwd)/deployments:/deployments" prom/prometheus:v2.53.3@sha256:c62e2f333beae2fdac8c3c7a3daaa7ac81110023cbc5857b0ec541f09d997951 check rules /deployments/prometheus-alerts.yml
          docker run --rm --entrypoint /bin/amtool -v "$(pwd)/deployments:/deployments" prom/alertmanager:v0.27.0@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5 check-config /deployments/alertmanager.yml

  production-image:
    name: Build production API image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Heavy image build and Trivy CVE scans run for main/release branches and dispatches,
    # keeping dev pull requests fast and lightweight.
    if: >-
      (github.event_name != 'pull_request' ||
       (github.event.action == 'labeled' && github.event.label.name == 'ci:full')) &&
      (github.event_name == 'workflow_dispatch' ||
       github.event_name == 'schedule' ||
       github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/heads/release/') ||
       github.base_ref == 'main' ||
       startsWith(github.base_ref, 'release/'))
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build production image
        run: docker build --target production-ai --tag avinya-hms-api:ci .

      - name: Scan production image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: avinya-hms-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore

      - name: Scan ClamAV image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: clamav/clamav:1.4.6-debian13-slim@sha256:c7df83a4c9794aeb43b7cff296fc9f42a0f47cbf0e96704510e7e5b57b2f4913
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore
