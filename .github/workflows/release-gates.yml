name: Release gates

on:
  # Full release validation is deliberately not run on every feature-branch commit.
  # Add the "ci:full" label to a PR when it is ready for the expensive gate.
  pull_request:
    branches: [main, dev, "release/**"]
    types: [labeled, synchronize]
  # Run automatically after code reaches protected integration/release branches.
  push:
    branches: [main, "release/**"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
  # Manual run: choose the branch from the Actions UI.
  workflow_dispatch:
  # Weekly drift/security check (Monday 07:00 IST).
  schedule:
    - cron: "30 1 * * 1"

permissions:
  contents: read

concurrency:
  group: release-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    if: >-
      github.event_name != 'pull_request' ||
      ((github.event.action == 'labeled' && github.event.label.name == 'ci:full') || (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'ci:full')))
    name: Python tests and PostgreSQL 17 migrations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-integrations.txt
            requirements-dev.txt
            requirements-ai.txt
            requirements-ai-pytorch.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt
          python -m pip_audit -r requirements-integrations.txt
          python -m pip_audit -r requirements-ai.txt
          python -m pip_audit -r requirements-ai-pytorch.txt

      - name: Verify test suite collection
        run: python -m pytest --collect-only -q

      - name: Run full test suite and PostgreSQL migration parity test
        env:
          ENVIRONMENT: testing
          RUN_POSTGRES17_INTEGRATION: "1"
          POSTGRES17_TEST_URL: postgresql+psycopg://postgres:ci-only-password@127.0.0.1:5432/postgres
        run: python -m pytest -q --durations=10

  onboarding-ui:
    if: >-
      github.event_name != 'pull_request' ||
      ((github.event.action == 'labeled' && github.event.label.name == 'ci:full') || (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'ci:full')))
    name: Build onboarding UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: onboarding-ui/package-lock.json

      - name: Install locked UI dependencies
        working-directory: onboarding-ui
        run: npm ci --no-audit --no-fund

      - name: Audit UI dependencies
        working-directory: onboarding-ui
        run: npm audit --audit-level=moderate

      - name: Test UI pricing utilities
        working-directory: onboarding-ui
        run: npm test

      - name: Build UI
        working-directory: onboarding-ui
        run: npm run build

  hospital-ui:
    if: >-
      github.event_name != 'pull_request' ||
      ((github.event.action == 'labeled' && github.event.label.name == 'ci:full') || (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'ci:full')))
    name: Build hospital UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hospital-ui/package-lock.json

      - name: Install locked UI dependencies
        working-directory: hospital-ui
        run: npm ci --no-audit --no-fund

      - name: Test Hospital UI role mapping
        working-directory: hospital-ui
        run: npm test

      - name: Build Hospital UI
        working-directory: hospital-ui
        run: npm run build

  compose-config:
    if: >-
      github.event_name != 'pull_request' ||
      ((github.event.action == 'labeled' && github.event.label.name == 'ci:full') || (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'ci:full')))
    name: Validate Compose configurations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate development Compose configuration
        run: |
          cp .env.example .env
          docker compose --env-file .env -f docker-compose.yml config --quiet

      - name: Validate production Compose configuration
        run: |
          cp .env.production.example .env.production
          docker compose --env-file .env.production -f docker-compose.prod.yml config --quiet

      - name: Validate Prometheus and Alertmanager configurations
        run: |
          mkdir -p .ci/prometheus-secrets
          printf 'ci-validation-token' > .ci/prometheus-secrets/metrics_scrape_token.txt
          docker run --rm --entrypoint /bin/promtool -v "$(pwd)/deployments:/deployments:ro" -v "$(pwd)/.ci/prometheus-secrets:/etc/prometheus:ro" prom/prometheus:v2.53.3@sha256:c62e2f333beae2fdac8c3c7a3daaa7ac81110023cbc5857b0ec541f09d997951 check config /deployments/prometheus.yml
          docker run --rm --entrypoint /bin/promtool -v "$(pwd)/deployments:/deployments:ro" prom/prometheus:v2.53.3@sha256:c62e2f333beae2fdac8c3c7a3daaa7ac81110023cbc5857b0ec541f09d997951 check rules /deployments/prometheus-alerts.yml
          docker run --rm --entrypoint /bin/amtool -v "$(pwd)/deployments:/deployments:ro" prom/alertmanager:v0.27.0@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5 check-config /deployments/alertmanager.yml

  production-image:
    name: Build and scan production images
    needs: [python-tests, onboarding-ui, hospital-ui, compose-config]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    # Heavy image build and Trivy CVE scans run for main/release branches and dispatches,
    # keeping dev pull requests fast and lightweight.
    if: >-
      (github.event_name != 'pull_request' ||
       ((github.event.action == 'labeled' && github.event.label.name == 'ci:full') || (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'ci:full')))) &&
      (github.event_name == 'workflow_dispatch' ||
       github.event_name == 'schedule' ||
       github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/heads/release/') ||
       github.base_ref == 'main' ||
       startsWith(github.base_ref, 'release/'))
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build production image
        run: docker build --target production-ai --tag avinya-hms-api:ci .

      - name: Scan production image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: avinya-hms-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore

      - name: Build production Hospital UI image
        run: docker build --file hospital-ui/Dockerfile --target production --tag avinya-hospital-ui:ci hospital-ui

      - name: Scan Hospital UI image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: avinya-hospital-ui:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore

      - name: Build patched ClamAV image
        run: docker build --file Dockerfile.clamav --tag avinya-clamav:1.4.6-patched .

      - name: Scan ClamAV image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: avinya-clamav:1.4.6-patched
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore
      # Generate machine-readable SBOMs from the exact images that passed the scans.
      - name: Generate API CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: avinya-hms-api:ci
          format: cyclonedx
          output: avinya-hms-api.cdx.json
          exit-code: "0"

      - name: Generate Hospital UI CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: avinya-hospital-ui:ci
          format: cyclonedx
          output: avinya-hospital-ui.cdx.json
          exit-code: "0"

      - name: Generate ClamAV CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: avinya-clamav:1.4.6-patched
          format: cyclonedx
          output: avinya-clamav.cdx.json
          exit-code: "0"

      - name: Upload release SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-sbom-${{ github.sha }}
          path: |
            avinya-hms-api.cdx.json
            avinya-hospital-ui.cdx.json
            avinya-clamav.cdx.json
          retention-days: 90
          if-no-files-found: error

      # Preserve the exact scanned images for a separately permissioned publish job.
      - name: Export scanned release images
        run: |
          set -euo pipefail
          docker save avinya-hms-api:ci avinya-hospital-ui:ci avinya-clamav:1.4.6-patched | gzip -1 > release-images.tar.gz

      - name: Upload scanned release images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-images-${{ github.sha }}
          path: release-images.tar.gz
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  verify-image-artifact:
    name: Verify scanned image artifact handoff
    needs: [production-image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Download scanned release images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-images-${{ github.sha }}
          path: release-images

      - name: Download release SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-sbom-${{ github.sha }}
          path: release-sbom

      - name: Verify CycloneDX SBOM set
        run: |
          set -euo pipefail
          for file in avinya-hms-api.cdx.json avinya-hospital-ui.cdx.json avinya-clamav.cdx.json; do
            jq -e '.bomFormat == "CycloneDX"' "release-sbom/$file" >/dev/null
          done

      - name: Load scanned release images
        run: gzip -dc release-images/release-images.tar.gz | docker load

      - name: Verify all scanned image tags are present
        run: |
          docker image inspect avinya-hms-api:ci avinya-hospital-ui:ci avinya-clamav:1.4.6-patched >/dev/null

  publish-images:
    name: Publish, attest, and verify release images
    needs: [production-image, verify-image-artifact]
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Download scanned release images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-images-${{ github.sha }}
          path: release-images

      - name: Download release SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-sbom-${{ github.sha }}
          path: release-sbom

      - name: Load scanned release images
        run: gzip -dc release-images/release-images.tar.gz | docker load

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Tag and publish scanned images
        id: publish
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE_NAMESPACE="ghcr.io/$(printf '%s' "$IMAGE_OWNER" | tr '[:upper:]' '[:lower:]')"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            CHANNEL_TAG="main"
          else
            CHANNEL_TAG="$(printf '%s' "${GITHUB_REF#refs/heads/}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_.-]/-/g')"
          fi

          publish_image() {
            local output_name="$1"
            local image_name="$2"
            local local_image="$3"
            local target="$IMAGE_NAMESPACE/$image_name"
            docker tag "$local_image" "$target:$IMAGE_REVISION"
            docker tag "$local_image" "$target:$CHANNEL_TAG"
            docker push "$target:$IMAGE_REVISION"
            docker push "$target:$CHANNEL_TAG"
            local digest
            digest="$(docker buildx imagetools inspect "$target:$IMAGE_REVISION" --format '{{json .Manifest}}' | jq -r '.digest')"
            test -n "$digest" && [ "$digest" != "null" ]
            printf '%s\n' "$target@$digest" | tee -a image-digests.txt
            printf '%s=%s\n' "$output_name" "$digest" >> "$GITHUB_OUTPUT"
          }

          : > image-digests.txt
          publish_image api_digest avinya-hms-api avinya-hms-api:ci
          publish_image hospital_ui_digest avinya-hospital-ui avinya-hospital-ui:ci
          publish_image clamav_digest avinya-clamav avinya-clamav:1.4.6-patched

          {
            echo "### GHCR image digests"
            echo
            echo "Source commit: $IMAGE_REVISION"
            echo
            cat image-digests.txt
          } >> "$GITHUB_STEP_SUMMARY"

      # Provenance attestations bind each immutable image digest to this workflow run and source revision.
      - name: Attest API image provenance
        id: attest_api_provenance
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/perseus37/avinya-hms-api
          subject-digest: ${{ steps.publish.outputs.api_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Wait before retrying attest api image provenance
        if: ${{ steps.attest_api_provenance.outcome == 'failure' }}
        run: sleep 10

      - name: Retry attest api image provenance
        if: ${{ steps.attest_api_provenance.outcome == 'failure' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/perseus37/avinya-hms-api
          subject-digest: ${{ steps.publish.outputs.api_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest Hospital UI image provenance
        id: attest_hospital_provenance
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/perseus37/avinya-hospital-ui
          subject-digest: ${{ steps.publish.outputs.hospital_ui_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Wait before retrying attest hospital ui image provenance
        if: ${{ steps.attest_hospital_provenance.outcome == 'failure' }}
        run: sleep 10

      - name: Retry attest hospital ui image provenance
        if: ${{ steps.attest_hospital_provenance.outcome == 'failure' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/perseus37/avinya-hospital-ui
          subject-digest: ${{ steps.publish.outputs.hospital_ui_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest ClamAV image provenance
        id: attest_clamav_provenance
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/perseus37/avinya-clamav
          subject-digest: ${{ steps.publish.outputs.clamav_digest }}
          push-to-registry: true
          create-storage-record: false

      # Sign the CycloneDX SBOMs against the exact image digests published above.

      - name: Wait before retrying attest clamav image provenance
        if: ${{ steps.attest_clamav_provenance.outcome == 'failure' }}
        run: sleep 10

      - name: Retry attest clamav image provenance
        if: ${{ steps.attest_clamav_provenance.outcome == 'failure' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/perseus37/avinya-clamav
          subject-digest: ${{ steps.publish.outputs.clamav_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest API CycloneDX SBOM
        id: attest_api_sbom
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/perseus37/avinya-hms-api
          subject-digest: ${{ steps.publish.outputs.api_digest }}
          sbom-path: release-sbom/avinya-hms-api.cdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Wait before retrying attest api cyclonedx sbom
        if: ${{ steps.attest_api_sbom.outcome == 'failure' }}
        run: sleep 10

      - name: Retry attest api cyclonedx sbom
        if: ${{ steps.attest_api_sbom.outcome == 'failure' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/perseus37/avinya-hms-api
          subject-digest: ${{ steps.publish.outputs.api_digest }}
          sbom-path: release-sbom/avinya-hms-api.cdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Attest Hospital UI CycloneDX SBOM
        id: attest_hospital_sbom
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/perseus37/avinya-hospital-ui
          subject-digest: ${{ steps.publish.outputs.hospital_ui_digest }}
          sbom-path: release-sbom/avinya-hospital-ui.cdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Wait before retrying attest hospital ui cyclonedx sbom
        if: ${{ steps.attest_hospital_sbom.outcome == 'failure' }}
        run: sleep 10

      - name: Retry attest hospital ui cyclonedx sbom
        if: ${{ steps.attest_hospital_sbom.outcome == 'failure' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/perseus37/avinya-hospital-ui
          subject-digest: ${{ steps.publish.outputs.hospital_ui_digest }}
          sbom-path: release-sbom/avinya-hospital-ui.cdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Attest ClamAV CycloneDX SBOM
        id: attest_clamav_sbom
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/perseus37/avinya-clamav
          subject-digest: ${{ steps.publish.outputs.clamav_digest }}
          sbom-path: release-sbom/avinya-clamav.cdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Wait before retrying attest clamav cyclonedx sbom
        if: ${{ steps.attest_clamav_sbom.outcome == 'failure' }}
        run: sleep 10

      - name: Retry attest clamav cyclonedx sbom
        if: ${{ steps.attest_clamav_sbom.outcome == 'failure' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/perseus37/avinya-clamav
          subject-digest: ${{ steps.publish.outputs.clamav_digest }}
          sbom-path: release-sbom/avinya-clamav.cdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Verify image provenance attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE_NAMESPACE="ghcr.io/$(printf '%s' "$IMAGE_OWNER" | tr '[:upper:]' '[:lower:]')"
          gh attestation verify "oci://$IMAGE_NAMESPACE/avinya-hms-api:$IMAGE_REVISION" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "oci://$IMAGE_NAMESPACE/avinya-hospital-ui:$IMAGE_REVISION" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "oci://$IMAGE_NAMESPACE/avinya-clamav:$IMAGE_REVISION" --repo "$GITHUB_REPOSITORY"

      - name: Record attestation evidence
        run: |
          {
            echo "### Supply-chain attestations"
            echo
            echo "- Signed SLSA build provenance generated for all three immutable image digests."
            echo "- Signed CycloneDX SBOM attestations generated for all three corresponding image digests."
            echo "- Image provenance verification completed with GitHub CLI."
          } >> "$GITHUB_STEP_SUMMARY"
