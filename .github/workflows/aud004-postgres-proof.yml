name: AUD-004 disposable PostgreSQL ACL proof

on:
  pull_request:
    branches: [main]
    paths:
      - "deployments/aud004-proof/**"
      - ".github/workflows/aud004-postgres-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aud004-postgres-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disposable-postgres-acl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out proof harness
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install isolated test dependencies
        run: python -m pip install --disable-pip-version-check pytest psycopg2-binary

      - name: Refuse pre-existing harness resources
        id: preflight
        env:
          AUD004_SETUP_PASSWORD: aud004-${{ github.run_id }}-${{ github.run_attempt }}-throwaway
        run: |
          if docker volume inspect aud004-proof-pgdata >/dev/null 2>&1; then
            echo "::error::Refusing to reuse existing aud004-proof-pgdata volume"
            exit 1
          fi
          if docker network inspect aud004-proof-only >/dev/null 2>&1; then
            echo "::error::Refusing to reuse existing aud004-proof-only network"
            exit 1
          fi
          existing_containers="$(docker compose -p aud004-proof -f deployments/aud004-proof/compose.yaml ps -a --quiet)"
          if [ -n "$existing_containers" ]; then
            echo "::error::Refusing to reuse an existing aud004-proof Compose project"
            exit 1
          fi
          echo "safe_to_cleanup=true" >> "$GITHUB_OUTPUT"

      - name: Start disposable PostgreSQL 17
        env:
          AUD004_SETUP_PASSWORD: aud004-${{ github.run_id }}-${{ github.run_attempt }}-throwaway
        run: docker compose -p aud004-proof -f deployments/aud004-proof/compose.yaml up -d --wait

      - name: Run real PostgreSQL ACL tests
        env:
          AUD004_PGHOST: 127.0.0.1
          AUD004_PGPORT: "55439"
        run: python -m pytest -q deployments/aud004-proof/test_acl.py

      - name: Tear down only the disposable proof project
        if: always() && steps.preflight.outputs.safe_to_cleanup == 'true'
        env:
          AUD004_SETUP_PASSWORD: aud004-${{ github.run_id }}-${{ github.run_attempt }}-throwaway
        run: |
          docker compose -p aud004-proof -f deployments/aud004-proof/compose.yaml down --volumes --remove-orphans
