# Isolated AUD-004 proof cluster. Never merge into the normal HMS Compose project.
name: aud004-proof
services:
  postgres:
    image: postgres:17-alpine@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0
    environment:
      POSTGRES_USER: aud004_setup
      POSTGRES_PASSWORD: ${AUD004_SETUP_PASSWORD:?Set AUD004_SETUP_PASSWORD to a disposable local-only value}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - aud004_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-aud004-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aud004_setup -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [aud004-only]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
volumes:
  aud004_pgdata:
    name: aud004-proof-pgdata
networks:
  aud004-only:
    name: aud004-proof-only
    internal: true
